[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lot-experiments"
version = "0.1.0"
description = "Reproducible experiments for optimal-transport Bellman backups"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "psutil>=5.9",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "seaborn>=0.13",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lot_experiments"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

